services:

  # =========================
  # Spring Boot Backend
  # =========================
  - type: web
    name: bp-backend
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile

    envVars:
      - key: DB_HOST
        fromDatabase:
          name: bp-database
          property: host

      - key: DB_PORT
        fromDatabase:
          name: bp-database
          property: port

      - key: DB_NAME
        fromDatabase:
          name: bp-database
          property: database

      - key: DB_USER
        fromDatabase:
          name: bp-database
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: bp-database
          property: password


  # =========================
  # React Frontend
  # =========================
  - type: web
    name: bp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist


# =========================
# PostgreSQL Database
# =========================
databases:

  - name: bp-database
    databaseName: bp_database
    user: bp_user
    plan: 0.1c-256mb
    region: singapore