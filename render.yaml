services:

  # ==========================
  # Spring Boot Backend
  # ==========================
  - type: web
    name: bp-backend
    runtime: java
    region: singapore
    plan: free

    rootDir: backend

    buildCommand: ./mvnw clean package -DskipTests

    startCommand: java -jar target/*.jar

    envVars:
      - key: DB_HOST
        fromDatabase:
          name: bp-database
          property: host

      - key: DB_PORT
        fromDatabase:
          name: bp-database
          property: port

      - key: DB_NAME
        fromDatabase:
          name: bp-database
          property: database

      - key: DB_USER
        fromDatabase:
          name: bp-database
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: bp-database
          property: password


  # ==========================
  # React Frontend
  # ==========================
  - type: web
    name: bp-frontend
    runtime: static
    plan: free

    rootDir: frontend

    buildCommand: npm install && npm run build

    staticPublishPath: ./dist


# ==========================
# PostgreSQL
# ==========================
databases:

  - name: bp-database
    region: singapore
    plan: free
    databaseName: bp_database
    user: bp_user
    postgresMajorVersion: "18"